<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KYFR — Know Your Financial Reality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --k-ground:#141414; --k-surface:#232323; --k-raised:#333; --k-raised2:#3d3d3d;
  --k-ink:#fff; --k-ink-soft:#DACBEB; --k-muted:#9b93a5; --k-line:#3a3a3a;
  --k-accent:#9F5FE5; --k-accent-strong:#801DEE; --k-accent-soft:#2A0552; --k-accent-ink:#E9E1F1; --k-accent-track:#3D057B;
  --k-safe:#14ED60; --k-safe-bg:#032810;
  --k-tradeoff:#F1AA3E; --k-tradeoff-bg:#342104;
  --k-harm:#F13E41; --k-harm-bg:#340405;
  --k-gold:#FFC24B; --k-gold-bg:#2E1F00;
  --k-cta-a:#F03BBD; --k-cta-b:#93066B;
  --k-border-grad:linear-gradient(90deg,rgba(240,59,189,.7) 0%,rgba(255,194,75,.7) 100%);
  --k-font:'Quicksand',-apple-system,sans-serif;
  --k-display:'Quicksand',-apple-system,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-in:cubic-bezier(.55,0,.45,1);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--k-font); background:var(--k-ground); color:var(--k-ink);
  overflow:hidden; position:fixed; inset:0; width:100%;
  -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* ── Ambient backdrop ───────────────────────────────────────── */
.backdrop{position:fixed;inset:0;overflow:hidden;z-index:0;background:var(--k-ground)}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;will-change:transform}
.blob1{width:60vmax;height:60vmax;background:radial-gradient(circle,var(--k-accent-strong),transparent 70%);top:-25vmax;left:-20vmax;animation:drift1 26s ease-in-out infinite}
.blob2{width:50vmax;height:50vmax;background:radial-gradient(circle,var(--k-cta-a),transparent 70%);bottom:-22vmax;right:-18vmax;opacity:.22;animation:drift2 32s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.08)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5vmax,-6vmax) scale(1.1)}}

/* ── App shell ──────────────────────────────────────────────── */
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.layout{position:relative;width:100%;height:100%;display:flex}
.stage{position:relative;width:100%;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.side-panel{display:none}
@media (min-width:640px){
  .stage{height:min(880px,94vh);max-height:920px;border-radius:28px;overflow:hidden;
    box-shadow:0 40px 100px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);background:var(--k-ground)}
}
/* ── Desktop: a real docked split-view, not a phone floating on a laptop ── */
@media (min-width:1024px){
  .layout{max-width:1080px;height:min(880px,92vh);max-height:920px;margin:0 auto;border-radius:28px;overflow:hidden;
    box-shadow:0 40px 100px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}
  .side-panel{display:flex;flex-direction:column;justify-content:space-between;flex:1;min-width:0;position:relative;overflow:hidden;
    padding:44px;background:linear-gradient(160deg,#231531,var(--k-ground) 72%)}
  .side-watermark{position:absolute;right:-70px;bottom:-70px;width:340px;height:340px;opacity:.05;filter:grayscale(1) brightness(3);pointer-events:none}
  .side-brand{display:flex;align-items:center;gap:11px;position:relative;z-index:2}
  .side-logo{width:34px;height:34px;border-radius:10px;overflow:hidden;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .side-logo img{width:100%;height:100%;object-fit:cover;display:block}
  .side-brand span{font-weight:800;font-size:15px;letter-spacing:.5px}
  .side-content{position:relative;z-index:2;transition:opacity .4s var(--ease)}
  .side-label{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--k-accent-ink);opacity:.75;margin-bottom:12px}
  .side-headline{font-family:var(--k-display);font-weight:600;font-size:clamp(26px,2.6vw,36px);line-height:1.25;max-width:15ch;text-wrap:balance}
  .stage{width:480px;flex:none;max-width:480px;height:100%;margin:0;border-radius:0;box-shadow:none;background:var(--k-ground);border-left:1px solid var(--k-line)}
}
.v-center{min-height:100%;display:flex;flex-direction:column;justify-content:center}

/* ── Progress rail ──────────────────────────────────────────── */
.progress-rail{position:relative;z-index:5;display:flex;gap:6px;padding:18px 22px 0;flex:none}
.progress-rail[hidden]{display:none}
.progress-seg{flex:1;height:4px;border-radius:100px;background:var(--k-line);overflow:hidden}
.progress-seg i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--k-accent),var(--k-cta-a));border-radius:100px;transition:width .6s var(--ease)}

/* ── Screens ────────────────────────────────────────────────── */
.screens{position:relative;flex:1;min-height:0}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  padding:28px 26px 26px;opacity:0;visibility:hidden;pointer-events:none;
  transform:translateX(24px) scale(.98);
  transition:opacity .5s var(--ease), transform .5s var(--ease), visibility 0s .5s;
}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0) scale(1);transition:opacity .5s var(--ease), transform .5s var(--ease), visibility 0s}
.screen.leaving{opacity:0;transform:translateX(-24px) scale(.98);transition:opacity .38s var(--ease-in), transform .38s var(--ease-in)}
.screen-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -26px;padding:0 26px}
.screen-scroll::-webkit-scrollbar{width:0}

/* ── Typography ─────────────────────────────────────────────── */
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--k-accent);display:flex;align-items:center;gap:8px;margin-bottom:14px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
h1.q-title{font-family:var(--k-display);font-weight:600;font-size:clamp(24px,5.5vw,32px);line-height:1.22;text-wrap:balance;margin-bottom:10px}
.q-sub{font-size:14.5px;color:var(--k-muted);line-height:1.55;margin-bottom:28px;max-width:44ch}

/* ── Currency fields ────────────────────────────────────────── */
.q-field{display:block;margin-bottom:20px}
.q-field-label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;color:var(--k-ink-soft);margin-bottom:9px}
.q-field-label .skip{font-size:12px;font-weight:600;color:var(--k-muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;background:none;border:none;padding:0}
.q-input-wrap{display:flex;align-items:center;background:var(--k-surface);border:1.5px solid var(--k-line);border-radius:16px;padding:0 18px;transition:border-color .25s var(--ease),background .25s var(--ease);position:relative}
.q-input-wrap:focus-within{border-color:var(--k-accent);background:#28202f}
.q-input-wrap.disabled{opacity:.4;pointer-events:none}
.q-prefix{font-family:var(--k-display);font-size:22px;font-weight:600;color:var(--k-muted);flex:none;margin-right:6px}
.q-input{flex:1;background:none;border:none;outline:none;color:var(--k-ink);font-family:var(--k-display);font-size:24px;font-weight:600;padding:16px 0;width:100%;min-width:0}
.q-input::placeholder{color:#5c5468}
.q-hint{display:block;font-size:12px;color:var(--k-muted);margin-top:7px;line-height:1.4}
.q-unit-suffix{font-size:13px;color:var(--k-muted);font-weight:700;flex:none;margin-left:6px}

/* stepper (age / dependents) */
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;background:var(--k-surface);border:1.5px solid var(--k-line);border-radius:20px;padding:22px}
.stepper-btn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--k-line);background:var(--k-raised);color:var(--k-ink);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s var(--ease),background .2s;flex:none}
.stepper-btn:active{transform:scale(.9);background:var(--k-accent-soft)}
.stepper-val{font-family:var(--k-display);font-size:40px;font-weight:600;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.stepper-cap{text-align:center;font-size:12px;color:var(--k-muted);margin-top:10px}

/* toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--k-surface);border:1.5px solid var(--k-line);border-radius:16px;padding:16px 18px;margin-bottom:18px;cursor:pointer;user-select:none}
.toggle-row span{font-size:13.5px;font-weight:700;color:var(--k-ink-soft)}
.toggle{width:46px;height:28px;border-radius:100px;background:var(--k-raised2);position:relative;flex:none;transition:background .25s var(--ease)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle.on{background:var(--k-accent)}
.toggle.on::after{transform:translateX(18px)}

/* ── Buttons ────────────────────────────────────────────────── */
.btn-row{flex:none;display:flex;gap:10px;padding-top:16px}
.btn{border-radius:100px;font-family:var(--k-font);font-weight:700;font-size:15px;cursor:pointer;transition:transform .15s var(--ease),opacity .2s,box-shadow .25s,background .2s;-webkit-appearance:none;display:flex;justify-content:center;align-items:center;gap:8px}
.btn:active{transform:scale(.97)}
.btn-primary{flex:1;padding:12px 20px;color:var(--k-ink);border:1px solid transparent;
  background-image:linear-gradient(0deg,#61224F 0%,#400F32 100%),var(--k-border-grad);
  background-origin:padding-box,border-box;background-clip:padding-box,border-box;
  box-shadow:0 10px 28px -10px rgba(240,59,189,.35)}
.btn-primary[disabled]{padding:16px 24px;color:var(--k-muted);border:1px solid transparent;
  background-image:linear-gradient(180deg,#271221 0%,#351A2D 100%),var(--k-border-grad);
  background-origin:padding-box,border-box;background-clip:padding-box,border-box;
  box-shadow:none;opacity:1;pointer-events:none}
.btn-ghost{padding:16px 24px;align-self:stretch;color:var(--k-muted);border:1px solid transparent;
  background-image:linear-gradient(var(--k-ground),var(--k-ground)),var(--k-border-grad);
  background-origin:padding-box,border-box;background-clip:padding-box,border-box}
.btn-text{background:none;border:none;color:var(--k-muted);font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}

/* ── Welcome screen ─────────────────────────────────────────── */
.welcome{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:100%}
.brand-mark{display:flex;align-items:center;gap:10px;margin-bottom:34px}
.brand-glyph{width:38px;height:38px;border-radius:11px;overflow:hidden;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.brand-glyph img{width:100%;height:100%;object-fit:cover;display:block}
.brand-word{font-weight:800;font-size:15px;letter-spacing:.5px}
.welcome h1{font-family:var(--k-display);font-weight:600;font-size:clamp(32px,8vw,46px);line-height:1.12;text-wrap:balance;margin-bottom:16px}
.welcome h1 em{font-style:normal;background:linear-gradient(120deg,var(--k-accent-ink),var(--k-cta-a));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{font-size:15.5px;color:var(--k-muted);line-height:1.65;max-width:40ch;margin-bottom:8px}
.welcome-trust{display:flex;gap:16px;margin-top:22px;flex-wrap:wrap}
.trust-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--k-muted);font-weight:600}
.trust-item svg{flex:none}
.welcome-spacer{flex:1}

/* ── Reveal screens ─────────────────────────────────────────── */
.reveal{display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;min-height:100%}
.reveal-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:100px;background:var(--k-gold-bg);color:var(--k-gold);font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;margin-bottom:22px;opacity:0;transform:translateY(8px) scale(.9);transition:all .55s var(--ease)}
.screen.active .reveal-badge{opacity:1;transform:translateY(0) scale(1);transition-delay:.15s}
.reveal-visual{width:100%;max-width:280px;margin-bottom:26px;opacity:0;transform:scale(.85);transition:all .6s var(--ease);transition-delay:.05s}
.screen.active .reveal-visual{opacity:1;transform:scale(1)}
.reveal-number{font-family:var(--k-display);font-weight:600;font-size:clamp(38px,11vw,56px);line-height:1;margin-bottom:14px;font-variant-numeric:tabular-nums}
.reveal-number.is-word{font-size:clamp(26px,8vw,38px);text-wrap:balance}
.reveal-headline{font-family:var(--k-display);font-weight:600;font-size:clamp(20px,5vw,25px);line-height:1.3;text-wrap:balance;margin-bottom:14px;opacity:0;transform:translateY(10px);transition:all .55s var(--ease);transition-delay:.28s}
.screen.active .reveal-headline{opacity:1;transform:translateY(0)}
.reveal-body{font-size:14.5px;color:var(--k-muted);line-height:1.6;max-width:38ch;margin-bottom:8px;opacity:0;transform:translateY(10px);transition:all .55s var(--ease);transition-delay:.4s}
.screen.active .reveal-body{opacity:1;transform:translateY(0)}
.reveal-source{font-size:10.5px;color:#635d6e;margin-top:14px}
.reveal-caption{font-size:11.5px;color:var(--k-muted);margin-top:10px;font-weight:600}
/* Edge-case flourishes — extreme-good and extreme-empty results get a visual
   treatment normal results don't. A drop-shadow filter alone reads as too
   subtle against thin SVG shapes (a ladder bar, a gauge needle), so this is a
   large blurred halo BEHIND the visual (guaranteed visible regardless of the
   shape it's behind) plus a floating badge and a gentle scale-pulse on the
   whole visual — three simultaneous, unmistakable signals, not one faint one. */
.reveal-visual{position:relative}
.reveal-visual.glow-good,.reveal-visual.glow-empty,.reveal-visual.glow-start{animation:edgeScale 1.8s ease-in-out infinite}
.reveal-visual.glow-good::before,.reveal-visual.glow-empty::before,.reveal-visual.glow-start::before{
  content:'';position:absolute;left:50%;top:50%;width:260px;height:260px;max-width:80vw;max-height:80vw;
  transform:translate(-50%,-50%);border-radius:50%;z-index:-1;pointer-events:none;
  animation:edgeHalo 1.8s ease-in-out infinite;
}
.reveal-visual.glow-good::before{background:radial-gradient(circle, rgba(20,237,96,.55), transparent 68%)}
.reveal-visual.glow-empty::before{background:radial-gradient(circle, rgba(241,170,62,.45), transparent 68%)}
.reveal-visual.glow-start::before{background:radial-gradient(circle, rgba(159,95,229,.45), transparent 68%)}
@keyframes edgeHalo{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.82)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes edgeScale{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
.edge-flourish{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:6px 14px;border-radius:100px;margin-bottom:14px;animation:edgeBadgeIn .5s var(--ease) both .3s}
.edge-flourish.good{background:var(--k-safe-bg);color:var(--k-safe)}
.edge-flourish.empty{background:var(--k-tradeoff-bg);color:var(--k-tradeoff)}
@keyframes edgeBadgeIn{from{opacity:0;transform:translateY(6px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.reveal-continue{width:100%;opacity:0;transform:translateY(10px);transition:all .5s var(--ease);transition-delay:.6s}
.screen.active .reveal-continue{opacity:1;transform:translateY(0)}

/* population ladder visual (income) */
.ladder{position:relative;height:120px;margin-top:34px;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.ladder-bar{position:relative;width:9px;border-radius:4px 4px 0 0;background:var(--k-raised2)}
.ladder-bar.you{background:linear-gradient(180deg,var(--k-gold),var(--k-cta-a))}
.ladder-marker{position:absolute;bottom:100%;left:50%;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);margin-bottom:6px}
.ladder-marker .pin{font-size:18px}

/* shield fill visual (savings/insurance) */
.shield-wrap{position:relative;width:120px;height:132px;margin:0 auto}
.shield-wrap svg{width:100%;height:100%;overflow:visible}
.shield-fill{transition:stroke-dashoffset 1.1s var(--ease)}

/* gauge visual (credit) */
.gauge-wrap{position:relative;width:220px;height:120px;margin:0 auto}
.gauge-needle{transform-origin:110px 108px;transition:transform 1s var(--ease)}

/* coin stack (income alt) */
.coin-stack{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:96px}
.coin{width:34px;border-radius:50%;background:linear-gradient(160deg,#ffe08a,var(--k-gold));box-shadow:0 3px 0 #8a6200,0 6px 14px rgba(0,0,0,.3);opacity:0;transform:translateY(14px) scale(.7)}
.screen.active .coin{animation:coinPop .5s var(--ease) forwards}

@keyframes coinPop{to{opacity:1;transform:translateY(0) scale(1)}}

/* ── Summary / cards (ported KYFR report system) ───────────── */
.kr-verdict{margin-bottom:20px}
.kr-eyebrow{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--k-accent);margin-bottom:8px}
.kr-verdict h1{font-family:var(--k-display);font-weight:600;font-size:22px;line-height:1.28;text-wrap:balance}
.kr-positive{background:linear-gradient(160deg,var(--k-accent-soft),#16032B);border:1px solid var(--k-accent-track);border-radius:16px;padding:17px 19px;margin-bottom:16px}
.kr-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--k-safe);margin-bottom:9px}
.kr-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--k-safe);box-shadow:0 0 8px var(--k-safe)}
.kr-pos-headline{font-size:16px;font-weight:700;line-height:1.35;margin-bottom:7px}
.kr-pos-payoff{font-size:13px;color:var(--k-ink-soft);line-height:1.5}
.kr-pos-payoff b{color:var(--k-safe)}
.kr-today{background:linear-gradient(135deg,var(--k-accent),#3D1E63);border:none;border-radius:20px;padding:20px 20px 18px;margin-bottom:20px;color:#fff;box-shadow:0 10px 30px -12px rgba(159,95,229,.4)}
.kr-today-eyebrow{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;opacity:.75;margin-bottom:12px}
.kr-today-icon{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.kr-today-trigger{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;opacity:.68;margin-bottom:5px}
.kr-today-body{font-size:19px;font-weight:700;line-height:1.32;margin-bottom:14px}
.kr-today-chips{display:flex;gap:8px;flex-wrap:wrap}
.kr-today-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;background:rgba(255,255,255,.14);border-radius:100px;padding:5px 12px}
.kr-alsolbl{font-size:15px;font-weight:700;color:var(--k-ink);margin:0 0 10px}
.kr-checklist{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.kr-check-item{display:flex;align-items:center;gap:10px;background:var(--k-surface);border:1px solid var(--k-line);border-radius:12px;padding:11px 14px}
.kr-check-n{width:20px;height:20px;border-radius:50%;background:var(--k-raised);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--k-muted);flex:none}
.kr-check-icon{font-size:15px;flex:none}
.kr-check-title{font-size:13px;font-weight:700;color:var(--k-ink-soft);flex:1}
.kr-moves{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.kr-move{background:var(--k-surface);border:1px solid var(--k-line);border-radius:16px;padding:15px 17px 16px;position:relative}
.kr-move::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--k-line)}
.kr-move.sev-critical::before{background:var(--k-harm)}
.kr-move.sev-caution::before{background:var(--k-tradeoff)}
.kr-move.sev-improve::before{background:var(--k-accent)}
.kr-move-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-left:8px}
.kr-move-icon{width:32px;height:32px;border-radius:10px;background:var(--k-raised);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.kr-move-title{font-family:var(--k-font);font-size:15px;font-weight:700;flex:1;line-height:1.3}
.kr-move-n{font-size:10.5px;font-weight:700;color:var(--k-muted);background:var(--k-raised);border-radius:100px;padding:1px 8px;flex:none}
.kr-move-body{padding-left:8px}
.kr-bar-wrap{margin-bottom:10px}
.kr-bar-labels{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 10px;font-size:11.5px;color:var(--k-muted);margin-bottom:6px}
.kr-bar-labels b{color:var(--k-ink);font-size:13px}
.kr-bar-track{height:9px;background:var(--k-raised);border-radius:100px;position:relative;overflow:visible}
.kr-bar-fill{height:100%;border-radius:100px;transition:width .4s}
.kr-bar-target{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.55);border-radius:2px}
.kr-steps{display:flex;align-items:flex-end;gap:8px;height:52px;margin-bottom:6px;padding-top:16px}
.kr-step-bar{flex:1;background:var(--k-accent-track);border-radius:5px 5px 2px 2px;position:relative;min-height:16px}
.kr-step-bar.last{background:var(--k-accent)}
.kr-step-lbl{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--k-ink-soft);white-space:nowrap;margin-bottom:4px}
.kr-steps-cap{font-size:11px;color:var(--k-muted);margin-bottom:10px}
.kr-daily{display:flex;align-items:center;gap:9px;background:var(--k-accent-soft);border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:12px;color:var(--k-ink-soft);line-height:1.4}
.kr-daily-icon{font-size:14px;flex:none}
.kr-daily b{color:var(--k-accent-ink)}
.kr-move-hero{display:flex;align-items:baseline;gap:8px;font-size:16px;font-weight:700;color:var(--k-ink);line-height:1.4;margin-bottom:14px}
.kr-move-hero .arrow{color:var(--k-accent);flex:none}
.kr-move-why-mini{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--k-ink-soft);line-height:1.5;margin:10px 0}
.kr-move-why-mini .ic{flex:none}
.kr-cost-lbl{font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--k-harm);margin-bottom:7px}
.kr-cost{display:flex;align-items:flex-start;gap:10px;background:var(--k-harm-bg);border-radius:10px;padding:10px 12px}
.kr-cost-icon{font-size:14px;flex:none;line-height:1.35}
.kr-cost-num{font-weight:800;font-size:14.5px;color:var(--k-harm);flex:none;white-space:nowrap;line-height:1.35}
.kr-cost-cap{font-size:11.5px;color:var(--k-ink-soft);line-height:1.35;flex:1;min-width:0}
.kr-why-link{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--k-accent);background:none;border:none;padding:12px 0 0;cursor:pointer;width:100%}
.kr-foot{font-size:11px;color:var(--k-muted);line-height:1.6;text-align:center;padding:14px 0 4px}
.kr-foot b{color:var(--k-ink-soft)}
.summary-detail-cta{background:linear-gradient(135deg,rgba(159,95,229,.14),rgba(240,59,189,.07));border:1px solid rgba(159,95,229,.4);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:14px;margin:14px 0;cursor:pointer;transition:border-color .2s,transform .15s}
.summary-detail-cta:hover{border-color:var(--k-accent)}
.summary-detail-cta:active{transform:scale(.98)}
.summary-detail-cta .ic{width:38px;height:38px;border-radius:11px;background:var(--k-accent-soft);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.summary-detail-cta .tx{flex:1;min-width:0}
.summary-detail-cta .tx b{display:block;font-size:13.5px;font-weight:700;margin-bottom:2px}
.summary-detail-cta .tx span{font-size:12px;color:var(--k-muted)}
.summary-detail-cta .chev{flex:none;color:var(--k-accent);font-size:17px;font-weight:700}
.summary-footer-link{background:none;border:none;color:var(--k-ink-soft);font-size:13px;font-weight:700;cursor:pointer;padding:6px;align-self:center;opacity:.85;transition:opacity .2s}
.summary-footer-link:hover{opacity:1}

/* ── Detail (drill-down) screen ─────────────────────────────── */
.detail-intro{font-size:13px;color:var(--k-muted);line-height:1.6;margin-bottom:14px}
.overview-ring-wrap{background:var(--k-surface);border:1px solid var(--k-line);border-radius:20px;padding:22px 18px 18px;margin-bottom:20px;display:flex;flex-direction:column;align-items:center}
.overview-ring{position:relative;width:150px;height:150px;margin-bottom:16px}
.overview-ring svg{width:100%;height:100%}
.overview-ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.overview-ring-center .n{font-family:var(--k-display);font-size:30px;font-weight:600;line-height:1}
.overview-ring-center .l{font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--k-muted);margin-top:3px}
.ring-legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;width:100%}
.ring-legend-item{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--k-ink-soft);font-weight:600}
.ring-legend-item .dot{width:8px;height:8px;border-radius:50%;flex:none}
.ring-legend-item .ic{flex:none}
.acc-action-hero{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:700;color:var(--k-ink);line-height:1.4;margin-bottom:14px}
.acc-action-hero .arrow{color:var(--k-accent);flex:none}
.stat-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stat-chip{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--k-raised);border-radius:12px;padding:10px 12px;flex:1;min-width:70px;text-align:center}
.stat-chip .ic{font-size:15px}
.stat-chip .v{font-size:14px;font-weight:800;color:var(--k-ink);font-family:var(--k-display);white-space:nowrap}
.stat-chip .l{font-size:9px;color:var(--k-muted);font-weight:700;text-transform:uppercase;letter-spacing:.2px}
.acc-caption{font-size:12px;color:var(--k-muted);line-height:1.5;margin-bottom:12px;font-style:italic}
.acc{border:1px solid var(--k-line);border-radius:16px;margin-bottom:10px;overflow:hidden;background:var(--k-surface)}
.acc-head{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;user-select:none}
.acc-pillar-icon{width:32px;height:32px;border-radius:10px;background:var(--k-raised);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.acc-head .ttl{flex:1;font-size:14px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.priority-tag{font-size:9.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--k-accent-ink);background:var(--k-accent-soft);border-radius:100px;padding:2px 8px}
.acc-head .sev-pill{font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:3px 9px;border-radius:100px;flex:none}
.sev-pill.critical{background:var(--k-harm-bg);color:var(--k-harm)}
.sev-pill.caution{background:var(--k-tradeoff-bg);color:var(--k-tradeoff)}
.sev-pill.improve{background:var(--k-accent-soft);color:var(--k-accent-ink)}
.sev-pill.healthy{background:var(--k-safe-bg);color:var(--k-safe)}
.acc-chev{transition:transform .3s var(--ease);color:var(--k-muted);flex:none}
.acc.open .acc-chev{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .4s var(--ease)}
.acc-body-in{padding:4px 16px 18px}
.acc-row{margin-bottom:12px}
.acc-row .k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--k-muted);margin-bottom:5px}
.acc-row .v{font-size:13px;color:var(--k-ink-soft);line-height:1.55}
.rank-reason{background:var(--k-raised);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--k-ink-soft);line-height:1.5;display:flex;gap:8px}
.rank-reason .n{flex:none}

/* ── App CTA screen ─────────────────────────────────────────── */
.cta-screen{display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;background:radial-gradient(circle at 50% 20%,var(--k-accent-soft),var(--k-ground) 65%);border-radius:20px}
.cta-phone{width:120px;height:120px;border-radius:30px;overflow:hidden;margin-bottom:26px;box-shadow:0 20px 50px -14px rgba(159,95,229,.6);animation:float 4s ease-in-out infinite}
.cta-phone img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.cta-screen h1{font-family:var(--k-display);font-weight:600;font-size:clamp(26px,6vw,34px);line-height:1.2;text-wrap:balance;margin-bottom:14px}
.cta-screen h1 em{font-style:normal;background:linear-gradient(120deg,var(--k-accent-ink),var(--k-cta-a));-webkit-background-clip:text;background-clip:text;color:transparent}
.cta-screen p{font-size:14.5px;color:var(--k-muted);line-height:1.6;max-width:36ch;margin-bottom:26px}
.cta-features{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-bottom:28px}
.cta-feature{display:flex;align-items:center;gap:12px;background:var(--k-surface);border:1px solid var(--k-line);border-radius:14px;padding:12px 14px;text-align:left}
.cta-feature .ic{font-size:18px;flex:none}
.cta-feature span{font-size:12.5px;color:var(--k-ink-soft);font-weight:600}
.notify-form{display:flex;gap:8px;width:100%;max-width:360px}
.notify-input{flex:1;background:var(--k-surface);border:1.5px solid var(--k-line);border-radius:100px;padding:14px 18px;color:var(--k-ink);font-size:14px;outline:none}
.notify-input:focus{border-color:var(--k-accent)}
.cta-restart{margin-top:22px}

/* confetti */
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:50}

/* scrollbar-less number input arrows off */
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

@media (max-width:380px){
  .screen{padding:22px 18px 20px}
  .q-input{font-size:21px}
}
</style>
</head>

<div id="app">
  <div class="layout">
    <div class="side-panel" id="side-panel">
      <img class="side-watermark" id="side-watermark" alt="">
      <div class="side-brand"><div class="side-logo" id="side-logo-wrap"></div><span>KYFR</span></div>
      <div class="side-content">
        <div class="side-label" id="side-label">Welcome</div>
        <div class="side-headline" id="side-headline">Two minutes.<br>Four honest answers.</div>
      </div>
      <div></div>
    </div>
    <div class="stage">
      <div class="progress-rail" id="progress-rail">
        <div class="progress-seg"><i id="pf-income"></i></div>
        <div class="progress-seg"><i id="pf-savings"></i></div>
        <div class="progress-seg"><i id="pf-credit"></i></div>
        <div class="progress-seg"><i id="pf-insurance"></i></div>
      </div>
      <div class="screens" id="screens"></div>
    </div>
  </div>
</div>

const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi,v));

function foirScoreBase(f){
  if(f<=.30) return 1.0;
  if(f<=.50) return 1.0-((f-.30)/.20)*.40;
  if(f<=.70) return 0.60-((f-.50)/.20)*.50;
  return 0.08;
}
function foirScorePreRet(f){
  if(f<=.10) return 1.0;
  if(f<=.20) return 1.0-((f-.10)/.10)*.28;
  if(f<=.30) return 0.72-((f-.20)/.10)*.27;
  if(f<=.40) return 0.45-((f-.30)/.10)*.27;
  if(f<=.70) return 0.18-((f-.40)/.30)*.13;
  return 0.03;
}
function foirScore(f, age){
  if(age < 50) return foirScoreBase(f);
  if(age >= 55) return foirScorePreRet(f);
  const t = (age-50)/5;
  return foirScoreBase(f)*(1-t) + foirScorePreRet(f)*t;
}
function utilScore(u){
  if(u <= 0.10) return 100;
  if(u <= 0.30) return 100 - (u-0.10)/0.20*15;
  if(u <= 0.60) return 85  - (u-0.30)/0.30*40;
  if(u <= 0.90) return 45  - (u-0.60)/0.30*45;
  return 0;
}
function coverageToScore(r){
  r = Math.max(0, r);
  if(r >= 1.00) return clamp(90 + 10*Math.min(1,(r-1)/0.5), 90, 100);
  if(r >= 0.75) return 75 + (r-0.75)/0.25*14;
  if(r >= 0.50) return 55 + (r-0.50)/0.25*19;
  return clamp(r/0.50*54, 0, 54);
}
function healthTarget(monthly_inc){
  const a = monthly_inc*12/100000;
  if(a <= 10) return 15;
  if(a <= 25) return 15 + (a-10)/15*60;
  return 75 + Math.min(1,(a-25)/175)*525;
}
const PROT_W = [0.7, 1.0, 1.3, 1.5, 1.5];
function protWeight(deps){ return PROT_W[Math.min(deps,4)]; }
function protFloor(deps){ return deps===0 ? 0.10 : 0.05; }
const incomeType = 'salaried';
function bufTarget(){ return 6; }
function enterpriseScore(){ return 0.92; }

function calcWeights({deps, age}){
  const pw = protWeight(deps);
  let s=1.0, c=1.5, i=1.2, p=pw, e=0.8;
  if(age >= 50){
    const t = clamp((age-50)/5, 0, 1);
    s = s + t*0.1; c = c + t*0.3; i = i + t*(0.9-i); p = p + t*(1.0-p);
  }
  return {savings:s, credit:c, investment:i, protection:p, enterprise:e};
}
function calcPillars(inp){
  const {liq, foi, crd, util, cvr, hlt, inv, age, deps, corpus, inc} = inp;
  const bt = bufTarget();
  const savings = clamp(liq/bt, 0, 1);
  let foirComp;
  if(age<28 && foi<20){
    const savDisc = clamp((inv/100)/0.05, 0, 1);
    const blend   = clamp((29-age)/3, 0, 1);
    foirComp = blend*savDisc + (1-blend)*foirScore(foi/100, age);
  } else { foirComp = foirScore(foi/100, age); }
  let crdEff = crd;
  if(age<29 && crd<680){ const t = clamp((29-age)/4, 0, 1); crdEff = crd + t*Math.max(0, 640-crd); }
  let bureau_score = clamp((crdEff-300)/600*100, 0, 100);
  if(crdEff >= 750) bureau_score = Math.min(100, bureau_score + (crdEff-750)/150*10);
  const bureau = bureau_score/100;
  const u_score = utilScore(util/100)/100;
  const credit = foirComp*0.50 + bureau*0.37 + u_score*0.13;
  const rateScore   = Math.max(0.05, clamp((inv/100)/0.20, 0, 1));
  const corpusScore = clamp(corpus/25, 0, 1);
  let investment;
  if(age < 48)      investment = rateScore;
  else if(age >= 52) investment = Math.max(0.05, corpusScore);
  else { const t = (age-48)/4; investment = Math.max(0.05, rateScore*(1-t) + corpusScore*t); }
  const life_r     = clamp(cvr/10, 0, 1.5);
  const prem_credit = clamp(Math.max(0, age-40)*0.006, 0, 0.20);
  const life_score  = coverageToScore(Math.min(life_r + prem_credit, 1.5));
  const hc_target   = healthTarget(inc);
  const health_r    = clamp(hlt/hc_target, 0, 1.5);
  const health_score = coverageToScore(health_r);
  const prot_raw  = 0.5*Math.min(life_score, health_score) + 0.5*(life_score+health_score)/2;
  const protection = clamp(Math.max(protFloor(deps), prot_raw/100), 0, 1);
  const enterprise = enterpriseScore();
  return {savings, credit, investment, protection, enterprise, hc_target, life_score, health_score,
    credit_foir:foirComp, credit_bureau:bureau, credit_util:u_score};
}
function calcFRI(pillars, weights){
  const W_SUM = Object.values(weights).reduce((a,b)=>a+b, 0);
  let denom = 0;
  for(const [k,w] of Object.entries(weights)) if(k in pillars) denom += w/Math.max(0.001, pillars[k]);
  const whm = W_SUM/denom;
  let mult = 1.0;
  if(pillars.savings < 0.167) mult *= 0.28; else if(pillars.savings < 0.333) mult *= 0.62;
  if(pillars.credit < 0.30) mult *= 0.78;
  return clamp(Math.round(whm*mult*100), 0, 100);
}
function whatIfFri(pillars, weights, key){
  const fixed = Object.assign({}, pillars, {[key]: Math.max(pillars[key], 0.60)});
  return calcFRI(fixed, weights);
}
const CASCADE = ['savings','credit','protection','investment'];
const SEVERITY = s => s < 0.35 ? ['CRITICAL'] : s < 0.55 ? ['CAUTION'] : s < 0.80 ? ['IMPROVE'] : ['OK'];

function krRs(n){
  n = Math.round(n);
  if(n >= 1e7) return '₹' + (n/1e7).toFixed(2).replace(/\.?0+$/,'') + ' Cr';
  if(n >= 1e5) return '₹' + (n/1e5).toFixed(1).replace(/\.0$/,'') + 'L';
  if(n >= 1000) return '₹' + Math.round(n/1000) + 'K';
  return '₹' + Math.max(0, n);
}
function krRound(n, step){ return Math.round(n/step)*step; }
function krStepPlan(seedRaw, target, stepPct){
  stepPct = stepPct || 0.20;
  const seed = krRound(Math.max(500, Math.min(seedRaw, target)), 500);
  if(target <= seed*1.15) return {seed, steps:0, years:0, stepPct:Math.round(stepPct*100)};
  const steps = Math.max(1, Math.ceil(Math.log(target/seed) / Math.log(1+stepPct)));
  return {seed, steps, years: +(steps*0.5).toFixed(1), stepPct:Math.round(stepPct*100)};
}
// Month-by-month FV of the ACTUAL step-up schedule (start small, +stepPct
// every 6 months, cap at target) — not a shortcut that assumes the full
// target contribution from month 1. Any "if you wait" number quoted against
// a ramp-up recommendation has to be earned by simulating the ramp itself,
// or it's advertising a bigger number than the plan it's attached to delivers.
function krRampFV(seedMonthly, targetMonthly, stepPct, months, annualRate){
  const r = annualRate/12;
  let balance = 0, current = seedMonthly;
  for(let m=1; m<=months; m++){
    balance = (balance+current)*(1+r);
    if(m%6===0 && current<targetMonthly) current = Math.min(targetMonthly, current*(1+stepPct));
  }
  return balance;
}
function krCover(cr){ return cr >= 1 ? '₹'+(+cr.toFixed(2)).toString().replace(/\.?0+$/,'')+'Cr' : '₹'+Math.round(cr*100)+'L'; }
const fmtHlt = v => v>=100 ? `₹${(v/100).toFixed(1)}Cr` : `₹${Math.round(v)}L`;
const KR_SEVCLASS = {CRITICAL:'critical', CAUTION:'caution', IMPROVE:'improve', OK:'improve'};
function krBar(current, target, curLabel, targetLabel, color){
  const scale = Math.max(current, target, 0.0001) * 1.15;
  const fillPct = Math.max(3, Math.min(100, current/scale*100));
  const targetPct = Math.min(97, target/scale*100);
  return `<div class="kr-bar-wrap"><div class="kr-bar-labels"><span><b>${curLabel}</b></span><span>target ${targetLabel}</span></div><div class="kr-bar-track"><div class="kr-bar-fill" style="width:${fillPct}%;background:${color}"></div><div class="kr-bar-target" style="left:${targetPct}%"></div></div></div>`;
}
function krSteps(plan, target, unit){
  if(!plan || !plan.steps) return '';
  unit = unit || '/mo';
  const mid = Math.sqrt(plan.seed * target);
  const vals = [plan.seed, mid, target];
  const bars = vals.map((v,i)=>`<div class="kr-step-bar${i===2?' last':''}" style="height:${Math.max(20, Math.round(v/target*100))}%"><span class="kr-step-lbl">${krRs(v)}${unit}</span></div>`).join('');
  return `<div class="kr-steps">${bars}</div><div class="kr-steps-cap">Small → medium → full, over about ${plan.years} years, stepping up ${plan.stepPct}% every 6 months.</div>`;
}
function termPremiumMonthly(age, coverCr){
  const perCr = age<=25?550: age<=30?700: age<=35?950: age<=40?1400: age<=45?2100: age<=50?3200: 4800;
  return Math.max(300, Math.round(perCr * coverCr / 50) * 50);
}
function healthPremiumAnnual(age, coverLakh, deps){
  const basePer5 = age<=30?6500: age<=40?9000: age<=50?14000: 21000;
  const fam = deps > 0 ? 1.5 : 1;
  return krRound(basePer5 * Math.sqrt(Math.max(1, coverLakh/5)) * fam, 500);

function krSimExtra(principal, annualRate, emi, cap){
  cap = cap || 600; const r = annualRate/12;
  let bal = principal, interest = 0, m = 0;
  while(bal > 0 && m < cap){ m++; const i = bal*r; if(emi-i <= 0) return {months:null, interest};
    interest += i; bal = (emi-i >= bal) ? 0 : bal-(emi-i); if(bal>0 && m%12===0) bal -= Math.min(emi, bal); }
  return {months: bal<=0?m:null, interest};
}

function krPositive(inp, pillars){

  if(pillars.life_score >= 85 && pillars.health_score >= 85 && (cvr>0 || hlt>0)) return {head:"Your family is fully protected.", payoff:`Both your life and health cover meet the mark for your income and dependents — the hardest box is already ticked.`};

function krPrioritise(cands){
  if(!cands.length) return [];
  const byConsequence = arr => arr.slice().sort((a,b)=> (b.crit - a.crit) || (b.delta - a.delta) || (a.score - b.score) || (a.cascade - b.cascade));
  const ranked = byConsequence(cands);
  const keystone = ranked[0];
  const rest = ranked.filter(c => c !== keystone);
  const effortRank = {LOW:0, MED:1, HIGH:2};
  const easy = rest.slice().sort((a,b)=> (effortRank[a.effort]-effortRank[b.effort]) || (b.crit-a.crit) || (b.delta-a.delta))[0];
  const picks = [keystone];
  if(easy) picks.push(easy);
  const third = byConsequence(rest.filter(c => c !== easy)).find(c => c.lbl !== 'IMPROVE');
  if(third && picks.length < 3) picks.push(third);
  return picks.slice(0,3);
}
function krVerdict(moves, hasCritical){
  if(hasCritical) return "There's real strain here — but it's fixable, and there's an order to it. Start with one thing, today.";

  if(moves.length === 1) return "You're most of the way there. One move takes you from solid to genuinely resilient.";
  return "You've built a real foundation. A couple of focused moves and you're resilient — here's the order.";
}

// 3. BENCHMARK ENGINE — real India data, cited in-product
//    Income: World Inequality Lab India 2024 (bottom-50% ≈ ₹5.9K/mo) +
//      ITR Stats percentile thresholds (top10%≈₹31L/yr, top5%≈₹42L/yr,
//      top1%≈₹71.5L/yr, FY25-26 filers).

//      Finology/Business Standard 2024 (75% lack adequate fund, 40% zero).

//      up from 41% in NFHS-5) + IRDAI FY25 (life penetration 2.7% of GDP).

// Anchored on the one hard, sourced figure available: World Inequality Lab's
// top-1% entry threshold for India, ₹20.7L/year (₹1,72,500/month) = P99,
// 2022-23. Bottom-50% average (₹71,000/year ≈ ₹5,900/month) anchors the
// other end. Everything between is a smooth log-interpolation, not a
// separately-sourced claim — intermediate points are deliberately not
// presented with false precision.
// Triangulated from multiple independent, named sources rather than one
// figure — each anchor cites what it's actually built on:
//  ₹3,000/mo  → P27.5  (PLFS 2023-24: bottom 27.5% of the labour force earn below this)
//  ₹9,000/mo  → P50    (PLFS 2023-24: median individual earning)
//  ₹15,000/mo → P78    (PLFS 2023-24: top 22% of the labour force earn above this)
//  ₹27,000/mo → P90    (PLFS-based "₹25-30k = top 10%" AND WID's ~₹3.2L/yr adult
//                        top-10% threshold independently agree here)
//  ₹55,000/mo → P95    (commonly-cited all-India top-5% threshold, ~₹6-7L/yr)
//  ₹1,72,500/mo → P99  (World Inequality Lab: top-1% entry threshold, ₹20.7L/yr, 2022-23)
//  ₹4,16,667/mo → P99.85 (derived: CBDT/ITR — top 1.4% of the ~6% who file ITR
//                          earn >₹50L/yr; 1.4% of the top 6% ≈ top 0.08% of all India)
//  ₹8,33,333/mo → P99.95 (derived the same way from "top 0.47% of filers >₹1Cr/yr")
// All-India basis throughout (PLFS/WID both count the full population, informal
// and agricultural sectors included) — deliberately not filtered to salaried
// urban India, since that's a different, much smaller reference class.
// Denominator is SALARIED INDIVIDUALS specifically, not all of India — a
// deliberate choice, since "all of India" includes ~80% of the workforce in
// informal, agricultural or casual work, which isn't the right comparison
// class for someone answering a salary question in this app. Anchors:
//  ₹11,000/mo → ~P20  (CMIE: median INFORMAL-salaried worker — the lower end
//                       of the "salaried" category, not the floor of all India)
//  ₹21,000/mo → P50   (PLFS 2023-24: average regular wage/salaried employee,
//                       used as the median proxy for this group)
//  ₹80,000/mo → P90   (Economic Survey of India 2020-21: salaried top-10%)
//  ₹1,20,000/mo → P95 (Economic Survey of India 2020-21: salaried top-5%)
//  ₹3,60,000/mo → P99 (Economic Survey of India 2020-21: salaried top-1%)
//  ₹10,00,000/mo → P99.8 (extrapolated tail for senior-leadership pay — not
//                          separately sourced, flagged as such)
// The 2020-21 figures are the most recent salaried-specific percentile table
// available; no newer one exists publicly, so they're used as-is rather than
// papered over with an unsourced inflation adjustment.
// Denominator: all individual income earners in India. A "salaried-only"
// curve was tried and reverted — the only breakdown found for that specific
// population (Economic Survey 2020-21, salaried percentiles) traced back to
// a single LinkedIn post with no primary source, so it wasn't trustworthy
// enough to stand behind. These anchors are all independently checkable:
//  ₹3,000/mo  → P27.5  (PLFS 2023-24: bottom 27.5% of the labour force earn below this)
//  ₹9,000/mo  → P50    (PLFS 2023-24: median individual earning)
//  ₹15,000/mo → P78    (PLFS 2023-24: top 22% of the labour force earn above this)
//  ₹27,000/mo → P90    (PLFS "₹25-30k = top 10%" AND World Inequality Lab's own
//                        ~₹3.2L/yr adult top-10% threshold independently agree)
//  ₹55,000/mo → P95    (commonly-cited all-India top-5% threshold, ~₹6-7L/yr)
//  ₹1,72,500/mo → P99  (World Inequality Lab: top-1% entry threshold, ₹20.7L/yr,
//                        2022-23 — matches independent ChatGPT/public-data checks)
//  ₹4,16,667/mo → P99.85 (derived: CBDT/ITR — top 1.4% of the ~6% who file ITR
//                          earn >₹50L/yr; 1.4% of the top 6% ≈ top 0.08% of all India)
//  ₹8,33,333/mo → P99.95 (derived the same way from "top 0.47% of filers >₹1Cr/yr")
const INCOME_ANCHORS = [
  [3000,27.5],[9000,50],[15000,78],[27000,90],
  [55000,95],[172500,99],[416667,99.85],[833333,99.95]
];
function interpPercentile(income){
  if(income<=INCOME_ANCHORS[0][0]) return INCOME_ANCHORS[0][1];
  for(let i=0;i<INCOME_ANCHORS.length-1;i++){
    const [x0,y0]=INCOME_ANCHORS[i], [x1,y1]=INCOME_ANCHORS[i+1];
    if(income<=x1){ const t=(Math.log(income)-Math.log(x0))/(Math.log(x1)-Math.log(x0)); return y0+t*(y1-y0); }
  }
  return 99.9;
}
function incomeInsight(inc){
  const pRaw = clamp(interpPercentile(Math.max(1,inc)), 1, 99.9);
  const topRaw = 100-pRaw;
  // Round ONCE, to the exact value the badge displays, then derive every
  // banding decision from that same rounded number — otherwise a raw
  // percentile just under a threshold (97.97) can round up to a headline
  // number ("top 2%") that implies a tier the copy below it disagrees with.
  const top = topRaw>=10 ? Math.round(topRaw) : topRaw>=1 ? Math.round(topRaw*2)/2 : +topRaw.toFixed(1);
  const p = 100-top;
  // One metric, shown exactly once: the "top X%" figure is the hero number
  // above this. Headline and body add new framing, never restate that digit.
  let headline, body;
  if(p>=99.5){ headline="You're in the rarest tier of earners."; body=`A position almost no one in India ever reaches.`; }
  else if(p>=98){ headline="You're deep in India's top earners."; body=`A bracket most people never get close to.`; }
  else if(p>=95){ headline="You're in top-5% territory."; body=`A position most Indian earners never reach.`; }
  else if(p>=90){ headline="You're already ahead of 9 out of 10 Indians."; body=`Firmly in the country's upper income tier.`; }
  else if(p>=75){ headline="You're earning more than most of India."; body=`Most of the country is earning less than you right now.`; }
  else if(p>=50){ headline="You're already earning more than half of India."; body=`You've cleared a bar most people are still working toward.`; }
  else { headline="This is exactly where most of India starts."; body=`You're not behind — you're building from a common, real starting point.`; }
  return {percentile:p, top, topLabel:`top ${top}%`, headline, body};
}

  const bandMap = {CRITICAL:'Needs Work', CAUTION:'Fair', IMPROVE:'Good', OK:'Excellent'};
  const band = bandMap[sevLbl];
  const factors = [
    {name:'EMI burden', score: pillars.credit_foir},
    {name:'Credit score', score: pillars.credit_bureau},
    {name:'Card usage', score: pillars.credit_util},
  ];
  const weakest = factors.slice().sort((a,b)=>a.score-b.score)[0];
  let headline, body;
  if(band==='Excellent'){ headline="Your credit health is excellent."; body=`EMI burden, score and card usage are all pulling their weight — lenders compete for you.`; }
  else if(band==='Good'){ headline="Your credit health is good."; body=`Solid overall — ${weakest.name} is the one area with the most room to grow.`; }
  else if(band==='Fair'){ headline="Your credit health is fair."; body=`${weakest.name} is what's dragging down an otherwise decent picture.`; }
  else { headline="Your credit health needs work."; body=`${weakest.name} is the single biggest drag right now — fixing that moves the needle most.`; }
  return {band, pct, headline, body, weakest};
}
function insuranceInsight(inp, pillars){
  const hasLife = inp.cvr>0, hasHealth = inp.hlt>0;
  const lifeOk = pillars.life_score>=78, healthOk = pillars.health_score>=78;
  // Life cover only protects people who depend on your income — with none,
  // it's genuinely not being weighed, not silently ignored. Said outright so
  // a ₹0 life-cover number is never confusing.
  const note = inp.deps===0 ? `You have no dependents, so life cover isn't being weighed here — health cover is, for everyone.` : null;
  if((inp.deps===0 || lifeOk) && healthOk){
    return {headline:"You've covered ground most households haven't.", body:`Only 6 in 10 Indian households have any health cover at all — you're ahead of the curve.`, note};
  }
  if(hasLife || hasHealth){
    return {headline:"You've already started — most people haven't.", body:`You're part of a rising minority. Next, let's make sure the cover is enough.`, note};
  }
  return {headline:"You're not alone — and that's exactly why this matters.", body:`Most Indian families are one bad diagnosis away from real financial damage.`, note};
}

// ══════════════════════════════════════════════════════════════
// 4. STATE + DERIVATION (absolute-₹ inputs → the % the engine needs)
// ══════════════════════════════════════════════════════════════
const ST = { age:28, deps:0, income:0, spending:0, savings:0, sip:0, retirementCorpus:0,
  emi:0, knownScore:null, cardBalance:0, cardLimit:0, noCardBalance:false, lifeCover:0, healthCover:0 };

// Runway is deliberately savings ÷ INCOME, not a separate "expenses" figure —
// that's the number people actually think in ("I have N months of my salary
// saved up"), it's the more conservative of the two (income ≥ what most
// people would actually spend), and it removes a whole second field that only
// ever caused confusion about how it related to EMIs. Every ratio below is
// also capped — a mismatched pair of absolute inputs can produce a
// mathematically "correct" but meaningless multiple otherwise.
// Runway (liq) and the retirement corpus multiple are both hedged on SPENDING,
// not income — that's the financially correct denominator (what you'd
// actually have to cover if income stopped), and it's the standard "25×
// annual spending" definition retirement planners use. Always surfaced to the
// user as "based on your spending," never left ambiguous.
function deriveInp(){
  const inc = ST.income;
  const spend = ST.spending;
  const foi = inc>0 ? Math.min(100, Math.round(ST.emi/inc*100)) : 0;
  const liq = spend>0 ? Math.min(60, +(ST.savings/spend).toFixed(1)) : 0;
  const inv = inc>0 ? Math.min(60, Math.round(ST.sip/inc*100)) : 0;
  const util = (ST.noCardBalance || ST.cardLimit<=0) ? 0 : Math.min(100, Math.round(ST.cardBalance/ST.cardLimit*100));
  const crd = ST.knownScore != null ? ST.knownScore : 700;
  const cvr = inc>0 ? Math.min(50, +(ST.lifeCover/(inc*12)).toFixed(1)) : 0;
  const hlt = Math.min(100000, +(ST.healthCover/1e5).toFixed(1));
  const corpus = (ST.age>=50 && spend>0) ? Math.min(60, +(ST.retirementCorpus/(spend*12)).toFixed(1)) : 0;
  return {inc, spend, liq, foi, crd, util, cvr, hlt, inv, age:ST.age, corpus, deps:ST.deps};
}

function fmtIndianInput(n){
  if(!n) return '';
  n = Math.round(n).toString();
  let last3 = n.slice(-3), rest = n.slice(0,-3);
  rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
  return rest ? rest+','+last3 : last3;
}
// Recognises Indian shorthand (1l/1 lakh/1cr/50k) so typing it doesn't silently
// get stripped to "1"; also hard-caps at 999,99,99,99,999 so no field can ever
// overflow the layout with a pathological string of digits.
// Only strips/expands shorthand and guards against a pathologically long
// string — the REAL, field-specific ceiling is applied by wireCurrency below,
// since "a plausible number" means something different for a credit-card
// limit than it does for a lifetime savings balance.
function parseNum(str){
  str = String(str).trim().toLowerCase().replace(/,/g,'');
  if(!str) return 0;
  const m = str.match(/^([0-9]*\.?[0-9]+)\s*(lakhs?|lacs?|crores?|cr|l|k)?$/);
  let num = 0;
  if(m){
    num = parseFloat(m[1]) || 0;
    const suf = m[2];
    if(suf === 'k') num *= 1e3;
    else if(suf && suf[0] === 'l') num *= 1e5;
    else if(suf && suf.slice(0,2) === 'cr') num *= 1e7;
  } else {
    num = parseFloat(str.replace(/[^0-9.]/g,'')) || 0;
  }
  return Math.min(1e13, Math.round(num));
}
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function animateCount(node, target, opts){
  opts = opts || {};
  const duration = opts.duration || 1000, prefix = opts.prefix||'', suffix = opts.suffix||'', decimals = opts.decimals||0;
  const start = performance.now();
  function tick(now){
    const t = Math.min(1,(now-start)/duration);
    const eased = 1-Math.pow(1-t,3);
    node.textContent = prefix + (target*eased).toFixed(decimals) + suffix;
    if(t<1) requestAnimationFrame(tick); else node.textContent = prefix+target.toFixed(decimals)+suffix;
  }
  requestAnimationFrame(tick);
}
function fireConfetti(big){
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth; canvas.height = innerHeight;
  const colors = big ? ['#9F5FE5','#F03BBD','#FFC24B','#14ED60','#FFD700'] : ['#9F5FE5','#F03BBD','#FFC24B','#14ED60'];
  const n = big ? 160 : 90;
  const spread = big ? 260 : 160;
  const parts = Array.from({length:n},()=>({
    x: innerWidth/2 + (Math.random()-0.5)*spread, y: innerHeight*0.32,
    vx:(Math.random()-0.5)*(big?13:10), vy:-Math.random()*(big?13:10)-4, size:(big?5:4)+Math.random()*4,
    color: colors[Math.floor(Math.random()*colors.length)], rot:Math.random()*360, vr:(Math.random()-0.5)*14, life:1
  }));
  function frame(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    parts.forEach(p=>{
      p.vy+=0.35; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=0.012;
      if(p.life>0){ alive=true; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
        ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); ctx.restore(); }
    });
    if(alive) requestAnimationFrame(frame); else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  frame();
}
addEventListener('resize', ()=>{ const c=document.getElementById('confetti-canvas'); if(c){c.width=innerWidth;c.height=innerHeight;} });

function wireCurrency(id, key, opts){
  opts = opts || {};
  const max = opts.max != null ? opts.max : 1e13;
  const input = document.getElementById(id);
  if(!input) return;
  input.addEventListener('input', ()=>{
    const raw = Math.min(max, parseNum(input.value));
    input.value = raw ? fmtIndianInput(raw) : '';
    ST[key] = raw;
    if(opts.onInput) opts.onInput(raw);
    validateCurrent();
  });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const btn=document.getElementById('btn-continue'); if(btn && !btn.disabled) btn.click(); } });
}

// visual builders for reveal screens
function renderLadder(percentile){
  const n = 12;
  const idx = Math.min(n-1, Math.round(percentile/100*(n-1)));
  let bars = '';
  for(let i=0;i<n;i++){
    const h = 16 + Math.pow(i/(n-1), 1.6)*84;
    const isYou = i===idx;
    bars += `<div class="ladder-bar${isYou?' you':''}" style="height:${h}%">${isYou?'<div class="ladder-marker"><span class="pin">📍</span></div>':''}</div>`;
  }
  return `<div class="ladder">${bars}</div>`;
}

// Takes the CONSOLIDATED 0-1 credit-health score (EMI burden + bureau score +
// card usage, blended the same 50/37/13 way the engine weighs them) — not

function renderGauge(pct01){

    <path id="gauge-arc" d="M14 110 A96 96 0 0 1 206 110" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 301"/>
    <line class="gauge-needle" id="gauge-needle" x1="110" y1="108" x2="110" y2="28" stroke="#fff" stroke-width="4" stroke-linecap="round" style="transform:rotate(-90deg)"/>
    <circle cx="110" cy="108" r="8" fill="#fff"/>

function animateGauge(pct01){

  }));

function pillarRankReason(cand, moves){
  if(!cand) return `On track — no action needed right now.`;
  const picked = moves.includes(cand);

  if(picked && rank===0) return `Your #1 priority — biggest impact of anything right now.`;
  if(picked) return `A genuinely low-effort win, alongside your top move.`;
  return `A real gap, but ${moves[0]?moves[0].title.toLowerCase():'your top pick'} matters more today.`;

  };
}
// The overview ring — one segment per pillar, coloured by status. Replaces a
// wordy methodology paragraph with a single picture of the whole picture.
function buildOverviewRing(cards){
  const colorMap = {critical:'var(--k-harm)', caution:'var(--k-tradeoff)', improve:'var(--k-accent)', healthy:'var(--k-safe)'};
  const r = 80, cx = 100, cy = 100, sw = 16;
  const circ = 2*Math.PI*r;
  const n = cards.length;
  const gap = 10;
  const segLen = circ/n - gap;
  const segs = cards.map((c,i)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorMap[c.sevCls]}" stroke-width="${sw}" stroke-dasharray="${segLen} ${circ-segLen}" stroke-dashoffset="${-(i*(circ/n))}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>`).join('');
  const onTrack = cards.filter(c=>c.sevCls==='healthy').length;
  const legend = cards.map(c=>`<div class="ring-legend-item"><span class="dot" style="background:${colorMap[c.sevCls]}"></span><span class="ic">${c.icon}</span><span>${c.title}</span></div>`).join('');
  return `<div class="overview-ring-wrap">
    <div class="overview-ring">
      <svg viewBox="0 0 200 200"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--k-raised)" stroke-width="${sw}"/>${segs}</svg>
      <div class="overview-ring-center"><div class="n">${onTrack}/${n}</div><div class="l">ON TRACK</div></div>
    </div>
    <div class="ring-legend">${legend}</div>
  </div>`;
}

function toggleAcc(headEl){
  const acc = headEl.closest('.acc');
  const body = acc.querySelector('.acc-body');
  const isOpen = acc.classList.contains('open');
  if(isOpen){ acc.classList.remove('open'); body.style.maxHeight = null; }
  else { acc.classList.add('open'); body.style.maxHeight = body.scrollHeight+'px'; }
}
function handleNotify(e){
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.textContent = "You're on the list ✓"; btn.disabled = true;
  return false;
}
function restartFlow(){
  Object.assign(ST, {age:28,deps:0,income:0,spending:0,savings:0,sip:0,retirementCorpus:0,emi:0,knownScore:null,cardBalance:0,cardLimit:0,noCardBalance:false,lifeCover:0,healthCover:0});
  screenHistory = []; document.getElementById('screens').innerHTML=''; currentScreenId = null;

}

// 7. ROUTER

let currentScreenId = null;
let screenHistory = [];
const VALIDATORS = { 'inc-q': () => ST.income>0 && ST.spending>0 };

function continueClick(){ const s=SCREENS[currentScreenId]; if(s && s.onContinue) s.onContinue(); }
function goBack(){ const prev = screenHistory.pop(); if(prev) goTo(prev, true); }

let isTransitioning = false;
function goTo(id, isBack){
  if(isTransitioning) return; // ignore rapid double-taps mid-transition
  isTransitioning = true;
  if(!isBack && currentScreenId) screenHistory.push(currentScreenId);
  const container = document.getElementById('screens');
  container.querySelectorAll('.screen:not(.active)').forEach(n=>n.remove()); // defensive: clear any stragglers
  const prev = container.querySelector('.screen.active');
  const node = el(SCREENS[id].render());
  container.appendChild(node);
  currentScreenId = id;
  updateProgress(id);
  updateSidePanel(id);
  requestAnimationFrame(()=>{
    node.classList.add('active');
    if(prev){ prev.classList.remove('active'); prev.classList.add('leaving'); }
  });
  if(SCREENS[id].mount) SCREENS[id].mount(node);
  validateCurrent();
  const scrollEl = node.querySelector('.screen-scroll'); if(scrollEl) scrollEl.scrollTop = 0;
  setTimeout(()=>{ if(prev && prev.parentNode) prev.remove(); isTransitioning = false; }, 460);
}
function validateCurrent(){
  const btn = document.getElementById('btn-continue');
  if(!btn) return;
  const v = VALIDATORS[currentScreenId];
  btn.disabled = v ? !v() : false;
}
function updateProgress(id){
  const rail = document.getElementById('progress-rail');
  rail.hidden = ['welcome','about','cta'].includes(id);
  const map = {'inc-q':0,'inc-r':0,'sav-q':1,'sav-r':1,'crd-q1':2,'crd-q2':2,'crd-r':2,'ins-q':3,'ins-r':3};
  const keys = ['income','savings','credit','insurance'];
  if(['summary','detail'].includes(id)){ keys.forEach(k=>document.getElementById('pf-'+k).style.width='100%'); return; }
  if(!(id in map)) return;
  const activeIdx = map[id];
  keys.forEach((k,i)=>{ document.getElementById('pf-'+k).style.width = i<activeIdx?'100%': i===activeIdx?(id.endsWith('-r')?'100%':'45%'):'0%'; });
}
const SIDE_CONTENT = {
  welcome: {label:'Welcome', headline:'Two minutes.<br>Four honest answers.'},
  about: {label:'Before we begin', headline:'Just the basics.'},
  'inc-q': {label:'Section 1 of 4', headline:'Income'}, 'inc-r': {label:'Section 1 of 4', headline:'Income'},
  'sav-q': {label:'Section 2 of 4', headline:'Savings'}, 'sav-r': {label:'Section 2 of 4', headline:'Savings'},
  'crd-q1': {label:'Section 3 of 4', headline:'Credit &amp; Loans'}, 'crd-q2': {label:'Section 3 of 4', headline:'Credit &amp; Loans'}, 'crd-r': {label:'Section 3 of 4', headline:'Credit &amp; Loans'},
  'ins-q': {label:'Section 4 of 4', headline:'Insurance'}, 'ins-r': {label:'Section 4 of 4', headline:'Insurance'},
  'inc-extreme': {label:'Section 1 of 4', headline:'Income'},

};
function updateSidePanel(id){
  const c = SIDE_CONTENT[id] || SIDE_CONTENT.welcome;
  const labelEl = document.getElementById('side-label'), headEl = document.getElementById('side-headline');
  if(labelEl) labelEl.textContent = c.label;
  if(headEl) headEl.innerHTML = c.headline;
}
